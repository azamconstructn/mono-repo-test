version: '3.8'

services:
  # User Service (Development)
  user-service-dev:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile.dev
      target: development
    container_name: t3d-user-service-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - SERVICE_NAME=user-service
      - DEBUG=*
    networks:
      - t3d-network-dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/services/user-service/node_modules
      - /app/packages/core-utils/node_modules
      - /app/packages/db-models/node_modules
    command: npm run dev:user
    restart: unless-stopped
    depends_on:
      - postgres-dev

  # Auth Service (Development)
  auth-service-dev:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile.dev
      target: development
    container_name: t3d-auth-service-dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - SERVICE_NAME=auth-service
      - DEBUG=*
      - JWT_SECRET=dev-jwt-secret-key
      - JWT_EXPIRES_IN=24h
    networks:
      - t3d-network-dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/services/auth-service/node_modules
      - /app/packages/core-utils/node_modules
      - /app/packages/db-models/node_modules
    command: npm run dev:auth
    restart: unless-stopped
    depends_on:
      - postgres-dev
      - redis-dev

  # Notification Service (Development)
  notification-service-dev:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile.dev
      target: development
    container_name: t3d-notification-service-dev
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - SERVICE_NAME=notification-service
      - DEBUG=*
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=dev-email@gmail.com
      - SMTP_PASS=dev-app-password
    networks:
      - t3d-network-dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/services/notification-service/node_modules
      - /app/packages/core-utils/node_modules
      - /app/packages/db-models/node_modules
    command: npm run dev:notification
    restart: unless-stopped
    depends_on:
      - postgres-dev
      - redis-dev

  # PostgreSQL Database (Development)
  postgres-dev:
    image: postgres:15-alpine
    container_name: t3d-postgres-dev
    environment:
      - POSTGRES_DB=t3d_api_dev
      - POSTGRES_USER=t3d_user_dev
      - POSTGRES_PASSWORD=t3d_password_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - t3d-network-dev
    restart: unless-stopped

  # Redis Cache (Development)
  redis-dev:
    image: redis:7-alpine
    container_name: t3d-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - t3d-network-dev
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Adminer for Database Management
  adminer:
    image: adminer:latest
    container_name: t3d-adminer
    ports:
      - "8080:8080"
    networks:
      - t3d-network-dev
    restart: unless-stopped
    depends_on:
      - postgres-dev

networks:
  t3d-network-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local 